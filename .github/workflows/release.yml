# Triggered by workflow_dispatch only - scripts/release_plugin.py in
# DalamudPluginsTC dispatches this explicitly after pushing the vX.Y.Z.N tag.
name: Release

on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download Dalamud (pinned TC-compatible build)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -OutFile dalamud-pinned.zip
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\"
          Expand-Archive -Force dalamud-pinned.zip "$env:AppData\xivlauncher\Addon\Hooks\dev\"
      - name: Compute version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v'
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build with dotnet
        run: dotnet build --configuration Release ChilledLeves/ChilledLeves.csproj -p:DalamudLibPath="$env:AppData\FFXIVSimpleLauncher\Dalamud\Injector\" -p:Version=${{ env.VER }} -p:AssemblyVersion=${{ env.VER }} -p:FileVersion=${{ env.VER }}
      - name: write version into manifest
        shell: pwsh
        run: |
          $path = './ChilledLeves/bin/Release/ChilledLeves/ChilledLeves.json'
          $json = Get-Content -Raw $path | ConvertFrom-Json
          $json.AssemblyVersion = "${{ env.VER }}"
          $json | ConvertTo-Json | Set-Content -Path $path
      - name: Rename artifact to ChilledLeves.zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter latest.zip | Select-Object -First 1
          Copy-Item $zip.FullName -Destination "ChilledLeves.zip"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            ChilledLeves.zip
            ChilledLeves/bin/Release/ChilledLeves/ChilledLeves.json
          generate_release_notes: true

